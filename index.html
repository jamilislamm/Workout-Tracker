<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Personal strength workout tracker. Offline, private, free."
    />
    <meta name="theme-color" content="#0f1318" />
    <title>Workout Tracker</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-dot" aria-hidden="true"></span>
          <span class="brand-name">Workout Tracker</span>
        </div>
        <div class="save-indicator" id="save-indicator" aria-live="polite">
          Ready
        </div>
      </header>

      <nav class="tabbar" aria-label="Main navigation">
        <a class="tab" href="#/dashboard" data-tab="dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5" />
            <path d="M5.5 9.5V21h13V9.5" />
          </svg>
          <span>Home</span>
        </a>
        <a class="tab" href="#/workout" data-tab="workout">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9v6M7 6.5v11M17 6.5v11M20 9v6M7 12h10" />
          </svg>
          <span>Workout</span>
        </a>
        <a class="tab" href="#/routines" data-tab="routines">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" />
          </svg>
          <span>Routines</span>
        </a>
        <a class="tab" href="#/progress" data-tab="progress">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 20h18" />
            <path d="M6 20V11M12 20V4M18 20v-6" />
          </svg>
          <span>Progress</span>
        </a>
        <a class="tab" href="#/settings" data-tab="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3.2" />
            <path
              d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"
            />
          </svg>
          <span>Settings</span>
        </a>
      </nav>

      <main class="view" id="view" tabindex="-1"></main>
    </div>

    <div id="rest-popup-root" class="rest-popup-root" hidden></div>

    <div id="undobar" class="undobar" hidden>
      <span id="undobar-text">Set updated</span>
      <button class="btn tiny" data-action="undo">Undo</button>
      <button class="icon-btn" data-action="dismiss-undo" aria-label="Dismiss">
        ✕
      </button>
    </div>

    <div id="modal-root"></div>
    <div id="auth-root"></div>
    <div
      id="toast-root"
      class="toast-root"
      aria-live="polite"
      aria-atomic="false"
    ></div>

    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
    <script src="cloud.js"></script>
    <script src="app.js"></script>
  </body>
</html>
